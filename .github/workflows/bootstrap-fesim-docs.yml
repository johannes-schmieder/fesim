name: Bootstrap fesim planning documents

on:
  push:
    paths:
      - .github/workflows/bootstrap-fesim-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Attach DESIGN.md and PLAN.md to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const designBlob = 'fec568b782f05b2583b7bd6657b66c6925dcdc97';
            const planBlob = '806e9f84b50e11a902a4063eeb254458526fe57f';
            const workflowPath = '.github/workflows/bootstrap-fesim-docs.yml';

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const parentSha = ref.data.object.sha;
            const parent = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha,
            });

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: [
                {
                  path: 'DESIGN.md',
                  mode: '100644',
                  type: 'blob',
                  sha: designBlob,
                },
                {
                  path: 'PLAN.md',
                  mode: '100644',
                  type: 'blob',
                  sha: planBlob,
                },
                {
                  path: workflowPath,
                  mode: '100644',
                  type: 'blob',
                  sha: null,
                },
              ],
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'docs: add fesim design and implementation plan',
              tree: tree.data.sha,
              parents: [parentSha],
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false,
            });

            core.notice(`Installed planning documents in commit ${commit.data.sha}`);
